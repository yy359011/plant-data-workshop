<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>植物科研数据工坊 · 功能图表</title><style>
*{box-sizing:border-box}body{margin:0;background:#f4f7f8;color:#183b3b;font:15px system-ui,"Microsoft YaHei",sans-serif}header{background:#153f41;color:white;padding:24px 30px}h1{font-size:24px;margin:0 0 8px}header p{margin:0;color:#c2dfd8;font-size:14px;line-height:1.7}.shell{display:grid;grid-template-columns:270px minmax(0,1fr);height:calc(100vh - 122px)}aside{padding:20px 16px;background:#fff;border-right:1px solid #dbe6e7;overflow:auto}.item{display:block;width:100%;border:0;border-radius:8px;background:none;padding:13px;text-align:left;font:inherit;font-size:14px;color:#426065;cursor:pointer;margin-bottom:6px}.item.active{background:#e0f2ed;color:#136753;font-weight:650}.group-label{font-size:11px;letter-spacing:1px;color:#7c9498;margin:12px 12px 10px}.download{display:block;color:#176c80;text-decoration:none;font-size:13px;padding:8px 12px}main{display:flex;flex-direction:column;min-width:0}.toolbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:white;padding:15px 22px;border-bottom:1px solid #dbe6e7}.toolbar h2{font-size:17px;margin:0 auto 0 0}.toolbar button,.toolbar a{border:1px solid #c8dcda;border-radius:6px;background:white;color:#245d58;padding:7px 10px;font-size:12px;text-decoration:none;cursor:pointer}.toolbar label{display:flex;align-items:center;gap:7px;font-size:12px}.toolbar input{width:95px}.canvas{overflow:auto;flex:1;padding:24px;min-height:280px}.canvas img{display:block;height:auto;background:white;box-shadow:0 6px 24px #1a535311;max-width:none;min-width:200px}.caption{padding:10px 22px;background:#eaf2f1;color:#4b6c6a;font-size:12px;line-height:1.65}@media(max-width:900px){.shell{display:block;height:auto}aside{border-bottom:1px solid #ddd;display:flex;flex-wrap:wrap;padding:10px}.item{width:auto;margin:2px;padding:8px}.group-label,.download{display:none}main{height:75vh}.toolbar{padding:12px}.toolbar h2{flex-basis:100%}header{padding:18px}h1{font-size:20px}.canvas{padding:12px}}
</style><header><h1>植物科研数据工坊 · 功能与操作图表</h1><p>先看思维导图，再看总流程；各模块横向阅读，虚线表示跨模块交接。可放大查看，全部文件离线可用。</p></header><div class="shell"><aside><div class="group-label">功能总览与模块操作</div><button class="item" data-page="0">01 系统功能思维导图</button><button class="item" data-page="1">02 总览操作流程</button><button class="item" data-page="2">03 资料接入与文献目录</button><button class="item" data-page="3">04 章节整理与来源核对</button><button class="item" data-page="4">05 批次抽检与数据包生成</button><button class="item" data-page="5">06 产出目录与检索</button><button class="item" data-page="6">07 账号权限与服务配置</button><button class="item" data-page="7">08 提示词与反馈规则</button><div class="group-label">整套文件</div><a class="download" href="植物科研数据工坊-图表全集.pdf" target="_blank">PDF 全集（8 页） ↗</a><a class="download" href="植物科研数据工坊-图表全集.drawio" download>可编辑 draw.io 全集 ↓</a></aside><main><div class="toolbar"><h2 id="title"></h2><button id="fit">适合宽度</button><label>缩放 <input id="zoom" type="range" min="10" max="200" step="5"><output id="percent"></output></label><a id="png" target="_blank">打开图片</a><a id="edit" download>编辑源文件 ↓</a></div><div class="canvas" id="canvas"><img id="diagram" alt=""></div><div class="caption">实线沿行展示模块内操作；带模块编号的虚线向下连接后续模块。权限以系统三个内置角色为准；抽检通过率不等于总体准确率。</div></main></div><script>
const items=[{"title": "01 系统功能思维导图", "base": "01-系统功能思维导图", "width": 2800, "height": 1800}, {"title": "02 总览操作流程", "base": "02-总览操作流程", "width": 2100, "height": 1260}, {"title": "03 资料接入与文献目录", "base": "03-资料接入与文献目录", "width": 2100, "height": 1450}, {"title": "04 章节整理与来源核对", "base": "04-章节整理与来源核对", "width": 2100, "height": 1450}, {"title": "05 批次抽检与数据包生成", "base": "05-批次抽检与数据包生成", "width": 2100, "height": 1450}, {"title": "06 产出目录与检索", "base": "06-产出目录与检索", "width": 2100, "height": 1190}, {"title": "07 账号权限与服务配置", "base": "07-账号权限与服务配置", "width": 2100, "height": 1730}, {"title": "08 提示词与反馈规则", "base": "08-提示词与反馈规则", "width": 2100, "height": 1190}], image=document.getElementById('diagram'),canvas=document.getElementById('canvas'),zoom=document.getElementById('zoom');let current=0;
function scale(value){value=Number(value);image.style.width=(items[current].width*value/100)+'px';zoom.value=value;document.getElementById('percent').textContent=Math.round(value)+'%'}
function fit(){scale(Math.max(10,Math.min(100,(canvas.clientWidth-48)/items[current].width*100)))}
function show(i){current=Math.max(0,Math.min(items.length-1,i));const item=items[current];image.src=item.base+'.png';image.alt=item.title;document.getElementById('title').textContent=item.title;document.getElementById('png').href=item.base+'.png';document.getElementById('edit').href=item.base+'.drawio';document.querySelectorAll('.item').forEach((b,n)=>b.classList.toggle('active',n===current));canvas.scrollTop=0;canvas.scrollLeft=0;fit()}
document.querySelectorAll('.item').forEach((b,i)=>b.addEventListener('click',()=>{location.hash='page='+(i+1)}));document.getElementById('fit').onclick=fit;zoom.oninput=()=>scale(zoom.value);window.addEventListener('hashchange',()=>show((parseInt(location.hash.split('=')[1])||1)-1));window.addEventListener('resize',fit);show((parseInt(location.hash.split('=')[1])||1)-1);
</script></html>
